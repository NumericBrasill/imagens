name: Sync Profile Images (webhook)

on:
  repository_dispatch:
    types: [sync-profile-images]

jobs:
  sync-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório de imagens
        uses: actions/checkout@v4

      - name: Copiar imagens do servidor Django via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p Colaboradores/profile
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          ssh-add key.pem
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i key.pem" $VPS_USER@$VPS_HOST:/var/www/sandbox.backend/apirest/media/user_image/* Colaboradores/profile/ || true
          ssh -i key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST 'rm -f /var/www/sandbox.backend/apirest/media/user_image/*' || true

      - name: Comitar e fazer push das novas imagens
        run: |
          git config user.name "CI"
          git config user.email "ci@github.com"
          git add Colaboradores/profile/
          if ! git diff --cached --quiet; then
            git commit -m "Novas imagens de perfil via webhook CI"
            git push
          fi
